<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="디지털 카드 바인더가 새 주소로 이전되었습니다."
    />
    <meta
      http-equiv="refresh"
      content="5; url=https://digital-card-binder.github.io/"
    />
    <link rel="canonical" href="https://digital-card-binder.github.io/" />
    <title>디지털 카드 바인더 새 주소</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0c1428;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(59, 130, 246, 0.22), transparent 42%),
          #0c1428;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(32px, 8vw, 56px);
        text-align: center;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(28px, 7vw, 42px);
        line-height: 1.25;
      }

      .address {
        display: block;
        overflow-wrap: anywhere;
        color: #93c5fd;
        font-size: clamp(17px, 4vw, 22px);
        font-weight: 700;
      }

      .notice {
        margin: 18px 0 28px;
        color: #cbd5e1;
        font-size: 15px;
      }

      .button {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        padding: 0 26px;
        border-radius: 999px;
        background: #facc15;
        color: #172033;
        font-weight: 800;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease;
      }

      .button:hover {
        background: #fde047;
        transform: translateY(-2px);
      }

      .button:focus-visible,
      .address:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>디지털 카드 바인더가<br />새 주소로 이전되었습니다.</h1>
      <a class="address" href="https://digital-card-binder.github.io/">
        digital-card-binder.github.io
      </a>
      <p class="notice">5초 후 새 사이트로 자동 이동합니다.</p>
      <a class="button" href="https://digital-card-binder.github.io/">
        새 사이트로 이동
      </a>
    </main>
  </body>
</html>
