name: Finalize Pokémon collections 21-40

on:
  push:
    paths:
      - ".github/workflows/finalize-pokemon-collections-21-40.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh collection count and cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('47 POKÉMON', '67 POKÉMON')
              updated = updated.replace(
                  'collector-nav.js?v=20260811-3',
                  'collector-nav.js?v=20260812-1',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          test_path = Path('tests/collector-ui-contract.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          updated = text.replace(
              'collector-nav[.]js\\?v=20260811-3',
              'collector-nav[.]js\\?v=20260812-1',
          )
          if updated != text:
              test_path.write_text(updated, encoding='utf-8')
              changed.append(str(test_path))

          print('updated files:')
          for item in changed:
              print('-', item)
          PY
      - name: Verify JavaScript syntax and collection data
        run: |
          node --check catalog.js
          node --check collector-nav.js
          node --test tests/collector-ui-contract.test.mjs
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('data/pokemon-collections.json').read_text(encoding='utf-8'))
          extra = json.loads(Path('data/pokemon-collections-21-40.json').read_text(encoding='utf-8'))
          assert len(extra) == 20
          assert [group['dexNumber'] for group in extra] == list(range(21, 41))
          names = {group['name'] for group in extra}
          merged = base[:20] + extra + [group for group in base[20:] if group['name'] not in names]
          assert len(merged) == 67
          assert len({group['name'] for group in merged}) == 67
          assert sum(len(group['cards']) for group in extra) == 449
          print('merged groups:', len(merged))
          print('new card entries:', sum(len(group['cards']) for group in extra))
          PY
      - name: Publish final integration
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' tests/collector-ui-contract.test.mjs
          git commit -m "Finalize Pokémon collections 021-040"
          git push origin HEAD:main
