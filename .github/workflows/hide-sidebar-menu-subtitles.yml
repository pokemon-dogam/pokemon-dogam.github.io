name: Hide sidebar menu subtitles

on:
  push:
    paths:
      - .github/workflows/hide-sidebar-menu-subtitles.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide sidebar subtitles and bust CSS cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          old = '''.collection-link small {\n  margin-top: 4px;\n  color: var(--ink-faint);\n  font-size: 0.69rem;\n}'''
          new = '''.collection-link small {\n  display: none;\n}'''
          if old in css:
              css = css.replace(old, new, 1)
          elif '.collection-link small {' in css and 'display: none;' not in css[css.index('.collection-link small {'):css.index('.collection-link small {')+120]:
              raise SystemExit('Unexpected .collection-link small rule')
          css_path.write_text(css, encoding='utf-8')

          for html in Path('.').glob('*.html'):
              text = html.read_text(encoding='utf-8')
              updated = re.sub(r'styles\.css\?v=[^"\']+', 'styles.css?v=20260812-2', text)
              if updated != text:
                  html.write_text(updated, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = Path('styles.css').read_text(encoding='utf-8')
          start = css.index('.collection-link small {')
          rule = css[start:css.index('}', start)+1]
          assert 'display: none;' in rule
          htmls = list(Path('.').glob('*.html'))
          assert htmls
          assert all('styles.css?v=20260812-2' in h.read_text(encoding='utf-8') for h in htmls if 'styles.css?v=' in h.read_text(encoding='utf-8'))
          PY

      - name: Commit changes
        run: |
          git config user.name "Youngdeukseo"
          git config user.email "128191608+Youngdeukseo@users.noreply.github.com"
          git add styles.css '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove sidebar menu subtitles"
            git push origin main
          fi
