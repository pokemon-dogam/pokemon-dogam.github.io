name: Probe Pokémon Korea card search

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-pokemoncard.yml"
      - "scripts/probe_pokemoncard.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/probe_pokemoncard.py
