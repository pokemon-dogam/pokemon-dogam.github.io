name: Expand Pokémon collection to 1025

on:
  push:
    paths:
      - .github/workflows/expand-pokemon-collection-1025.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand Pokémon selector to full National Pokédex
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('catalog.js')
          text = path.read_text(encoding='utf-8')

          old_constants = '''const SERIES_DATA_URL = "./data/series.json";\nconst POKEMON_DATA_URL = "./data/pokemon-collections.json";\nconst POKEMON_SEQUENCE_DATA_URL = "./data/pokemon-collections-21-40.json";'''
          new_constants = '''const SERIES_DATA_URL = "./data/series.json";\nconst POKEMON_DATA_URL = "./data/pokemon-collections.json";\nconst POKEMON_SEQUENCE_DATA_URL = "./data/pokemon-collections-21-40.json";\nconst POKEDEX_DATA_URL = "./data/pokedex.json";'''
          if old_constants not in text and 'POKEDEX_DATA_URL' not in text:
              raise SystemExit('catalog constants pattern not found')
          if 'POKEDEX_DATA_URL' not in text:
              text = text.replace(old_constants, new_constants, 1)

          old_loader = '''async function loadCatalogGroups() {\n  if (mode === "series") return fetchJson(SERIES_DATA_URL);\n\n  const [baseGroups, sequenceGroups] = await Promise.all([\n    fetchJson(POKEMON_DATA_URL),\n    fetchJson(POKEMON_SEQUENCE_DATA_URL),\n  ]);\n  const sequenceNames = new Set(sequenceGroups.map((group) => group.name));\n  const originalFirstTwenty = baseGroups.slice(0, 20);\n  const existingSelections = baseGroups\n    .slice(20)\n    .filter((group) => !sequenceNames.has(group.name));\n\n  return [...originalFirstTwenty, ...sequenceGroups, ...existingSelections];\n}'''
          new_loader = '''async function loadCatalogGroups() {\n  if (mode === "series") return fetchJson(SERIES_DATA_URL);\n\n  const [baseGroups, sequenceGroups, pokedex] = await Promise.all([\n    fetchJson(POKEMON_DATA_URL),\n    fetchJson(POKEMON_SEQUENCE_DATA_URL),\n    fetchJson(POKEDEX_DATA_URL),\n  ]);\n\n  // 기존에 카드 데이터가 있는 포켓몬은 그대로 보존하되,\n  // #0001~#1025 전국도감 전체를 선택 목록의 기준으로 사용합니다.\n  const populatedByName = new Map();\n  for (const group of baseGroups) {\n    if (group?.name) populatedByName.set(group.name, group);\n  }\n  for (const group of sequenceGroups) {\n    if (group?.name) populatedByName.set(group.name, group);\n  }\n\n  const records = Array.isArray(pokedex?.records) ? pokedex.records : [];\n  if (records.length !== 1025) {\n    throw new Error(`전국도감 데이터가 1025종이 아닙니다: ${records.length}`);\n  }\n\n  return records.map((record) => {\n    const existing = populatedByName.get(record.nameKo);\n    if (existing) {\n      return { ...existing, dexNumber: record.number };\n    }\n    return {\n      name: record.nameKo,\n      dexNumber: record.number,\n      cards: [],\n    };\n  });\n}'''
          if old_loader not in text and 'records.length !== 1025' not in text:
              raise SystemExit('loadCatalogGroups pattern not found')
          if 'records.length !== 1025' not in text:
              text = text.replace(old_loader, new_loader, 1)

          # Empty Pokémon groups are valid now; make that state clear instead of looking like a failed search.
          old_render_tail = '''  $("catalog-grid").replaceChildren(...shown.map(makeCard));\n  setText("result-count", shown.length);\n  $("catalog-empty").hidden = shown.length !== 0;\n}'''
          new_render_tail = '''  $("catalog-grid").replaceChildren(...shown.map(makeCard));\n  setText("result-count", shown.length);\n  const empty = $("catalog-empty");\n  empty.hidden = shown.length !== 0;\n  const emptyTitle = empty.querySelector("h3");\n  if (emptyTitle) {\n    emptyTitle.textContent =\n      mode === "pokemon" && cards.length === 0\n        ? "카드 데이터 준비 중입니다"\n        : "검색 결과가 없습니다";\n  }\n}'''
          if old_render_tail in text:
              text = text.replace(old_render_tail, new_render_tail, 1)

          path.write_text(text, encoding='utf-8')

          # Keep the navigation count consistent across every static page.
          for html in Path('.').glob('*.html'):
              h = html.read_text(encoding='utf-8')
              h2 = h.replace('67 POKÉMON', '1025 POKÉMON')
              if html.name == 'pokemon-collections.html':
                  h2 = h2.replace('catalog.js?v=20260812-2', 'catalog.js?v=20260812-3')
                  h2 = h2.replace('catalog.js?v=20260812-1', 'catalog.js?v=20260812-3')
                  h2 = h2.replace('catalog.js?v=20260727-5', 'catalog.js?v=20260812-3')
              if h2 != h:
                  html.write_text(h2, encoding='utf-8')
          PY

      - name: Validate changes
        run: |
          node --check catalog.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/pokedex.json').read_text(encoding='utf-8'))
          assert len(p['records']) == 1025
          assert p['records'][0]['number'] == 1 and p['records'][0]['nameKo'] == '이상해씨'
          assert p['records'][-1]['number'] == 1025 and p['records'][-1]['nameKo'] == '복숭악동'
          text = Path('catalog.js').read_text(encoding='utf-8')
          assert 'POKEDEX_DATA_URL' in text
          assert 'records.length !== 1025' in text
          html = Path('pokemon-collections.html').read_text(encoding='utf-8')
          assert '1025 POKÉMON' in html
          assert 'catalog.js?v=20260812-3' in html
          PY

      - name: Commit changes
        run: |
          git config user.name "Youngdeukseo"
          git config user.email "128191608+Youngdeukseo@users.noreply.github.com"
          git add catalog.js '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show all 1025 Pokémon in collection selector"
            git push origin main
          fi
